# Build/deploy only. Env vars are NOT declared here — set them on the Railway
# service Variables tab (see DEPLOY.md). Required for start:prod:
#   DATABASE_URL = ${{Postgres.DATABASE_URL}}   # name must match your Postgres service
#   JWT_SECRET   = <long random string>
#   CORS_ORIGIN  = https://<frontend-host>

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# Apply pending Prisma migrations before traffic switches to the new release.
releaseCommand = "bunx prisma migrate deploy"
startCommand = "bun run start:prod"
healthcheckPath = "/api/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
